<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签伪指令渲染查看器</title>
    <!-- 添加Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tag"></i> 商品标签伪指令设计和实现渲染查看器</h1>
        </header>
        
        <!-- 标签页导航 -->
        <div class="tab-navigation">
            <button class="tab-button active" data-tab="editor-tab">
                <i class="fas fa-code"></i> 代码模式
            </button>
            <button class="tab-button" data-tab="designer-tab">
                <i class="fas fa-paint-brush"></i> 可视化编辑模式
            </button>
            <button class="tab-button" data-tab="preview-tab">
                <i class="fas fa-eye"></i> 预览模式
            </button>
        </div>
        
        <!-- 标签页内容 -->
        <div class="tab-content">
            <!-- 标签指令编辑区 -->
            <div id="editor-tab" class="tab-pane active">
                <div class="editor-section">
                    <div class="input-group">
                        <label for="instruction-input"><i class="fas fa-code"></i> 标签指令:</label>
                        <textarea id="instruction-input" placeholder="在此输入标签指令，每行一条&#10;以#开始的行是注释&#10;例如:&#10;# 这是一个标签示例&#10;text,10,5,40,8,12,Arial,bold,center,#000000,产品名称">&#10;# 这是一个商品标签示例&#10;text,10,5,40,8,12,Arial,bold,center,#000000,产品名称&#10;barcode,CODE128,5,15,50,10,true,1234567890128&#10;qrcode,45,15,20,Q,https://example.com/product/12345</textarea>
                    </div>
                </div>
            </div>
            
            <!-- 可视化设计区 -->
            <div id="designer-tab" class="tab-pane">
                <div class="designer-section">
                    <div class="designer-header">
                        <h2><i class="fas fa-ruler-combined"></i> 可视化设计器</h2>
                    </div>
                    <div class="designer-wrapper">
                        <div id="visual-designer"></div>
                        <!-- 属性面板 -->
                        <div id="properties-panel" class="properties-panel">
                            <h3><i class="fas fa-sliders-h"></i> 属性面板</h3>
                            <div id="properties-content"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 标签预览区 -->
            <div id="preview-tab" class="tab-pane">
                <div class="preview-section">
                    <h2><i class="fas fa-eye"></i> 标签预览</h2>
                    <div id="label-preview"></div>
                </div>
            </div>
        </div>
        
        <!-- 指令控件列表 -->
        <div id="toolbox" class="toolbox">
            <h3><i class="fas fa-toolbox"></i> 指令控件</h3>
            <div class="toolbox-content">
                <div class="toolbox-item" data-type="text" draggable="true">
                    <i class="fas fa-font"></i>
                    <span>文本</span>
                </div>
                <div class="toolbox-item" data-type="barcode" draggable="true">
                    <i class="fas fa-barcode"></i>
                    <span>条形码</span>
                </div>
                <div class="toolbox-item" data-type="qrcode" draggable="true">
                    <i class="fas fa-qrcode"></i>
                    <span>二维码</span>
                </div>
                <div class="toolbox-item" data-type="image" draggable="true">
                    <i class="fas fa-image"></i>
                    <span>图片</span>
                </div>
                <div class="toolbox-item" data-type="line" draggable="true">
                    <i class="fas fa-grip-lines"></i>
                    <span>直线</span>
                </div>
                <div class="toolbox-item" data-type="rectangle" draggable="true">
                    <i class="far fa-square"></i>
                    <span>矩形</span>
                </div>
            </div>
        </div>
        
        <aside class="help-section">
            <h2><i class="fas fa-question-circle"></i> 当前指令帮助</h2>
            <div class="help-content">
                <div id="current-instruction-help">
                    <p><i class="fas fa-info-circle"></i> 将光标定位到指令输入框的某一行，此处将显示该行指令的详细帮助信息。</p>
                </div>
            </div>
        </aside>
    </div>
    
    <script src="js/instruction-parser.js"></script>
    <script src="js/label.js"></script>
    <script src="js/label-renderer.js"></script>
    <script src="js/help-data.js"></script>
    <script src="js/visual-designer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
