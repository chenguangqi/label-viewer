<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签伪指令渲染查看器</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>商品标签伪指令设计和实现渲染查看器</h1>
        </header>
        
        <main>
            <div class="editor-section">
                <div class="input-group">
                    <label for="instruction-input">标签指令:</label>
                    <textarea id="instruction-input" placeholder="在此输入标签指令，每行一条&#10;以#开始的行是注释&#10;例如:&#10;# 这是一个标签示例&#10;label,70,40,#FFFFFF,2&#10;text,10,5,40,8,12,Arial,bold,center,#000000,产品名称">&#10;# 这是一个商品标签示例&#10;label,70,40,#FFFFFF,2&#10;text,10,5,40,8,12,Arial,bold,center,#000000,产品名称&#10;barcode,CODE128,5,15,50,10,true,1234567890128&#10;qrcode,45,15,20,Q,https://example.com/product/12345</textarea>
                </div>
                
                <div class="button-group">
                    <button id="render-btn">渲染标签</button>
                    <button id="clear-btn">清空</button>
                </div>
            </div>
            
            <div class="preview-section">
                <h2>标签预览</h2>
                <div id="label-preview"></div>
            </div>
        </main>
        
        <aside class="help-section">
            <h2>当前指令帮助</h2>
            <div class="help-content">
                <div id="current-instruction-help">
                    <p>将光标定位到指令输入框的某一行，此处将显示该行指令的详细帮助信息。</p>
                </div>
            </div>
        </aside>
    </div>
    
    <script src="js/instruction-parser.js"></script>
    <script src="js/label-renderer.js"></script>
    <script src="js/help-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
